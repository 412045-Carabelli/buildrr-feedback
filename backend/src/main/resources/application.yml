server:
  port: 8090

spring:
  application:
    name: buildrr-feedback-service
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=buildrr_feedback;encrypt=false;trustServerCertificate=true
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
  flyway:
    enabled: true

jwt:
  # Mismo default que sistema-gestion-obras usa en dev (application-dev.properties
  # de auth-service/api-gateway). En prod, JWT_SECRET tiene que ser el valor real
  # configurado en el VPS de SGO — no está versionado en ningún repo.
  secret: ${JWT_SECRET:your-super-secret-key-min-32-chars-long-for-hs256-algorithm}

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: buildrr-feedback

management:
  endpoints:
    web:
      exposure:
        include: health
