server:
  port: 8090

spring:
  application:
    name: buildrr-feedback-service
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:buildr_supp};encrypt=false;trustServerCertificate=true
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
  flyway:
    enabled: true
  servlet:
    multipart:
      # Provisorio — ver docs/01-alcance.md "Decisiones pendientes": falta
      # confirmar con Pablo el tamaño máximo real de video que va a subir.
      max-file-size: 100MB
      max-request-size: 100MB

documentos:
  # No maneja storage propio — los adjuntos van al documentos-service
  # compartido de SGO (mismo MinIO, servicio distinto), identificados con
  # producto=BUILDRR_FEEDBACK y tipo_asociado=ticket. Ver AdjuntoServiceImpl
  # y strategy/BuildrrFeedbackDocumentoStrategy del lado de documentos-service.
  service:
    url: ${DOCUMENTOS_SERVICE_URL:http://localhost:8087/api/documentos}

management:
  endpoints:
    web:
      exposure:
        include: health
