server:
  port: 8090

spring:
  application:
    name: buildrr-feedback-service
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:buildr_supp};encrypt=false;trustServerCertificate=true
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
  flyway:
    enabled: true
  servlet:
    multipart:
      # Provisorio — ver docs/01-alcance.md "Decisiones pendientes": falta
      # confirmar con Pablo el tamaño máximo real de video que va a subir.
      max-file-size: 100MB
      max-request-size: 100MB

jwt:
  # Mismo secret HS256 que auth-service de SGO — única fuente de identidad
  # del ecosistema. Mismo default que sistema-gestion-obras usa en dev. En
  # prod, JWT_SECRET tiene que ser el valor real configurado en el VPS de
  # SGO — no está versionado en ningún repo.
  secret: ${JWT_SECRET:your-super-secret-key-min-32-chars-long-for-hs256-algorithm}

sgo:
  # A qué "ambiente" de SGO le pega /auth/login: prod (sgo_auth, dominio
  # público real) o test (sgo_auth_test, solo alcanzable si alguien corre
  # auth-service local con perfil dev — ver auth-service/application-dev.properties
  # de sistema-gestion-obras, puerto 8089). Default: prod.
  gateway-url: ${SGO_GATEWAY_URL:https://buildrr.cloud}

minio:
  # Mismo MinIO que ya usa el stack SGO (documentos-service), bucket propio
  # "buildrr-feedback" separado del de SGO. Credenciales: mismo valor que
  # sistema-gestion-obras/backend1.0/documentos-service/application-prod.properties
  # (MINIO_ROOT_USER/PASSWORD del docker-compose de SGO).
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: buildrr-feedback

management:
  endpoints:
    web:
      exposure:
        include: health
