server:
  port: 8090

spring:
  application:
    name: buildrr-feedback-service
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:buildr_supp};encrypt=false;trustServerCertificate=true
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
  flyway:
    enabled: true
  servlet:
    multipart:
      # Provisorio — ver docs/01-alcance.md "Decisiones pendientes": falta
      # confirmar con Pablo el tamaño máximo real de video que va a subir.
      max-file-size: 100MB
      max-request-size: 100MB

jwt:
  # Mismo default que sistema-gestion-obras usa en dev (application-dev.properties
  # de auth-service/api-gateway). En prod, JWT_SECRET tiene que ser el valor real
  # configurado en el VPS de SGO — no está versionado en ningún repo.
  secret: ${JWT_SECRET:your-super-secret-key-min-32-chars-long-for-hs256-algorithm}
  # Secret propio de buildrr-feedback, solo para tokens de cuentas FrezCo. Tiene
  # que ser DISTINTO de jwt.secret.
  own-secret: ${JWT_OWN_SECRET:buildrr-feedback-own-secret-min-32-chars-long-hs256}

sgo:
  # Dominio público real de SGO — el mismo /auth/login que usa Pablo para
  # entrar al sistema día a día (el nginx del frontend de SGO proxea /auth
  # internamente al api-gateway, ver frontend/nginx.conf de sistema-gestion-obras).
  gateway-url: ${SGO_GATEWAY_URL:https://buildrr.cloud}

frezco:
  # Solo para el chequeo de ruteo del Mediator — la contraseña NUNCA vive acá,
  # se valida contra el login real de FrezCo (ver FrezcoAuthColleague).
  app-user: ${FREZCO_APP_USER:}
  login-url: ${FREZCO_LOGIN_URL:https://frezco.buildrr.cloud}

minio:
  # Mismo MinIO que ya usa el stack SGO (documentos-service), bucket propio
  # "buildrr-feedback" separado del de SGO. Credenciales: mismo valor que
  # sistema-gestion-obras/backend1.0/documentos-service/application-prod.properties
  # (MINIO_ROOT_USER/PASSWORD del docker-compose de SGO).
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: buildrr-feedback

management:
  endpoints:
    web:
      exposure:
        include: health
