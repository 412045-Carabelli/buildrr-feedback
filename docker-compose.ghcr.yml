# =======================
# Buildrr Feedback con imagenes publicadas en GHCR (ghcr.io/412045-carabelli/buildrr-feedback-*),
# en vez de buildearlas localmente. Es lo que se corre en el VPS.
#
# Las publica .github/workflows/publish-ghcr.yml en cada push a main.
#
# Prerequisito: la red `sgo_backend` tiene que existir (la crea el compose de obras).
#   docker network ls | grep sgo_backend
#
# Uso standalone:
#   docker compose -f docker-compose.ghcr.yml up -d
#
# Para sumarlo al stack de obras, copiar los servicios backend/frontend/backup (no
# crear-base, que corre una vez sola) dentro del docker-compose.ghcr.yml de ese stack.
#
# Dominio: el frontend se engancha ademas a `dokploy-network`, la red que administra
# Dokploy. El subdominio (soporte.<dominio real>) y el certificado se asignan desde
# el panel de Dokploy, no en este archivo.
# =======================
services:

  crear-base:
    image: mcr.microsoft.com/mssql-tools
    container_name: buildrr_feedback_crear_base_standalone
    volumes:
      - ./db:/db:ro
    environment:
      - DB_HOST=${DB_HOST:-sqlserver}
      - DB_PORT=${DB_PORT:-1433}
      - DB_NAME=${DB_NAME:-buildr_supp}
      - DB_USER=${DB_USER:-sa}
      - DB_PASSWORD=${DB_PASSWORD}
    entrypoint:
      - /bin/bash
      - -c
      - |
        for i in $$(seq 1 30); do
          /opt/mssql-tools/bin/sqlcmd -S "$$DB_HOST,$$DB_PORT" -U "$$DB_USER" -P "$$DB_PASSWORD" -Q "SELECT 1" && break
          echo "Esperando SQL Server ($$i)"; sleep 5
        done
        /opt/mssql-tools/bin/sqlcmd -S "$$DB_HOST,$$DB_PORT" -U "$$DB_USER" -P "$$DB_PASSWORD" \
          -Q "IF DB_ID(N'$$DB_NAME') IS NULL EXEC('CREATE DATABASE [$$DB_NAME]')"
    restart: "no"
    networks:
      - sgo_backend

  backend:
    pull_policy: always
    image: ghcr.io/412045-carabelli/buildrr-feedback-backend:latest
    container_name: buildrr_feedback_backend_standalone
    ports:
      - "${BACKEND_PORT:-8091}:8090"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=${DB_HOST:-sqlserver}
      - DB_PORT=${DB_PORT:-1433}
      - DB_NAME=${DB_NAME:-buildr_supp}
      - DB_USER=${DB_USER:-sa}
      - DB_PASSWORD=${DB_PASSWORD}
      - DOCUMENTOS_SERVICE_URL=${DOCUMENTOS_SERVICE_URL:-http://documentos-service:8087/api/documentos}
      - JAVA_OPTS=-Xms64m -Xmx256m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
    depends_on:
      crear-base:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      sgo_backend:
        # Alias sin "_": java.net.URI / UriComponentsBuilder de Spring no
        # aceptan underscore en el host (aunque el DNS de Docker si resuelve
        # container_name con "_" sin problema) — el api-gateway de SGO le
        # pega a este alias (application-prod.properties routes[7]/[8]/[9]/[10]),
        # no al container_name.
        aliases:
          - feedback-backend

  frontend:
    pull_policy: always
    image: ghcr.io/412045-carabelli/buildrr-feedback-frontend:latest
    container_name: buildrr_feedback_frontend_standalone
    ports:
      - "${FRONTEND_PORT:-4301}:80"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - sgo_backend
      - dokploy-network

  # Backup diario de la base a las 03:00, retencion 7 dias. No se publica en GHCR: se
  # buildea local, es liviano y cambia poco.
  backup:
    build: ./backup
    container_name: buildrr_feedback_backup_standalone
    environment:
      - DB_HOST=${DB_HOST:-sqlserver}
      - DB_PORT=${DB_PORT:-1433}
      - DB_NAME=${DB_NAME:-buildr_supp}
      - DB_USER=${DB_USER:-sa}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - backup_data:/backups
    depends_on:
      crear-base:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - sgo_backend

networks:
  sgo_backend:
    external: true
  dokploy-network:
    external: true

volumes:
  backup_data:
