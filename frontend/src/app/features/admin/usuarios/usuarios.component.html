<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<app-layout-header type="list" title="Usuarios" [subtitle]="'Accesos a ' + nombreProductoActual"></app-layout-header>

<div class="p-6 max-w-3xl space-y-4">
  <div class="bg-white rounded-xl shadow-md p-6">
    <h2 class="font-poppins font-semibold text-gray-900 mb-4 flex items-center gap-2 pb-3 border-b border-gray-200">
      <i class="pi pi-user-plus text-indigo-600"></i>
      Dar de alta
    </h2>

    <div class="flex items-end gap-3 flex-wrap">
      <div class="flex-1 min-w-[220px]">
        <label class="block text-sm font-medium text-gray-700 mb-1">Username (mismo que en SGO/FrezCo)</label>
        <input type="text" pInputText class="w-full" [(ngModel)]="nuevoUsername" placeholder="usuario@ejemplo.com" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Rol</label>
        <p-select [(ngModel)]="nuevoRol" [options]="opcionesRol" optionLabel="label" optionValue="value" styleClass="w-36"></p-select>
      </div>
      <p-button label="Dar de alta" icon="pi pi-user-plus" [loading]="dandoDeAlta" [disabled]="!nuevoUsername.trim()" (onClick)="darDeAlta()"></p-button>
    </div>
  </div>

  <div class="bg-white rounded-xl shadow-md overflow-hidden">
    <p-table [value]="usuarios" [loading]="cargando" dataKey="id">
      <ng-template pTemplate="header">
        <tr>
          <th>Username</th>
          <th>Rol</th>
          <th></th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-usuario>
        <tr>
          <td>{{ usuario.username }}</td>
          <td><p-tag [severity]="usuario.rol === 'ADMIN' ? 'warn' : 'info'" [value]="usuario.rol === 'ADMIN' ? 'Admin' : 'Cliente'"></p-tag></td>
          <td class="text-right">
            <p-button icon="pi pi-trash" [text]="true" [rounded]="true" severity="danger" (onClick)="confirmarRevocar(usuario)"></p-button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="3" class="text-center text-gray-400 py-8">Sin usuarios cargados para este producto.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
