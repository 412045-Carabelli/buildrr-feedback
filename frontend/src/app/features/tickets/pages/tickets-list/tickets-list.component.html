<p-toast></p-toast>

<app-layout-header type="list" title="Tickets" subtitle="Bugs y funciones nuevas cargados">
  <a header-actions routerLink="/tickets/nuevo">
    <p-button label="Nuevo ticket" icon="pi pi-plus" styleClass="btn-mobile-icon"></p-button>
  </a>
</app-layout-header>

<div class="p-6 space-y-4">
  <div class="bg-white rounded-xl shadow-md p-4 flex items-center justify-end">
    <p-select
      [ngModel]="filtroDropdown"
      (ngModelChange)="filtrarPorEstado($event)"
      [options]="opcionesEstado"
      optionLabel="label"
      optionValue="value"
      styleClass="w-56">
    </p-select>
  </div>

  <p-table [value]="tickets" [loading]="cargando" [paginator]="true" [rows]="15" dataKey="id">
    <ng-template pTemplate="header">
      <tr>
        <th>#</th>
        <th>Título</th>
        <th>Tipo</th>
        <th>Producto</th>
        <th>Módulo</th>
        <th>Estado</th>
        <th>Fecha</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-ticket>
      <tr class="cursor-pointer" (click)="verTicket(ticket.id)">
        <td>{{ ticket.id }}</td>
        <td>{{ ticket.titulo }}</td>
        <td>{{ ticket.tipo === 'BUG' ? 'Bug' : 'Función nueva' }}</td>
        <td>{{ nombreProducto(ticket.producto) }}</td>
        <td>{{ ticket.modulo || '—' }}</td>
        <td><p-tag [severity]="severityEstado(ticket.estado)" [value]="nombreEstado(ticket.estado)"></p-tag></td>
        <td>{{ ticket.fecha | date: 'dd/MM/yyyy' }}</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="7" class="text-center text-gray-400 py-8">Todavía no hay tickets cargados.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
