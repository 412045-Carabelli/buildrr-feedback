<p-toast></p-toast>

<div class="p-6 max-w-2xl">
  <h1 class="text-2xl font-semibold text-gray-800 mb-6">Nuevo ticket</h1>

  <form [formGroup]="form" (ngSubmit)="guardar()" class="flex flex-col gap-4 bg-white border border-gray-200 rounded-lg p-6">

    <div class="flex gap-4">
      <div class="flex flex-col gap-1 flex-1">
        <label class="text-sm font-medium text-gray-700">Tipo</label>
        <p-select formControlName="tipo" [options]="tipos" optionLabel="label" optionValue="value" styleClass="w-full"></p-select>
      </div>

      <div class="flex flex-col gap-1 flex-1">
        <label class="text-sm font-medium text-gray-700">Producto</label>
        <p-select formControlName="producto" [options]="productos" optionLabel="label" optionValue="value" styleClass="w-full"></p-select>
      </div>
    </div>

    <div class="flex flex-col gap-1">
      <label for="titulo" class="text-sm font-medium text-gray-700">Título</label>
      <input pInputText id="titulo" formControlName="titulo" class="w-full" />
      @if (form.get('titulo')?.invalid && form.get('titulo')?.touched) {
        <span class="text-xs text-red-500">Título requerido, mínimo 3 caracteres</span>
      }
    </div>

    <div class="flex flex-col gap-1">
      <label for="descripcion" class="text-sm font-medium text-gray-700">
        Descripción
        @if (form.get('tipo')?.value === 'BUG') {
          <span class="text-gray-400 font-normal">— qué pasa y cómo reproducirlo</span>
        }
      </label>
      <textarea pTextarea id="descripcion" formControlName="descripcion" rows="6" class="w-full"></textarea>
    </div>

    <div class="flex justify-end gap-2 mt-2">
      <p-button label="Crear ticket" type="submit" [loading]="guardando"></p-button>
    </div>

  </form>
</div>
