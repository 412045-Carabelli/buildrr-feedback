<div
  class="w-full h-full rounded-xl shadow-md p-6 flex flex-col justify-between transition-shadow"
  [ngClass]="{ 'cursor-pointer hover:shadow-lg': clickable }"
  [style.backgroundColor]="backgroundColor"
  [style.borderLeftColor]="borderColor"
  [style.borderLeftWidth.px]="6"
  [pTooltip]="tooltip || ''"
  tooltipPosition="top">
  <div>
    <div class="flex items-center gap-2 mb-2">
      @if (icon) {
        <i [class]="icon" [style.color]="textColor"></i>
      }
      <span class="text-sm font-poppins font-semibold text-gray-600">{{ title }}</span>
    </div>
    <p class="text-2xl font-poppins font-bold line-clamp-2" [style.color]="textColor">{{ value }}</p>
    @if (description) {
      <p class="text-xs text-gray-500 mt-1 line-clamp-2">{{ description }}</p>
    }
  </div>
</div>
